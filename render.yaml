services:
  - type: web
    name: commtech-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: commtech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://commtechsolutions-frontend.onrender.com
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: commtech-frontend
    runtime: static
    plan: starter
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://commtechsolutions-backend.onrender.com/api
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false

databases:
  - name: commtech-db
    plan: starter
    databaseName: commtech
    user: commtech
